# AgentShield horizontal scale-out (item 5).
#
#   docker compose up --build
#
# The decision engine is stateless, so the gateway scales by adding
# replicas: gateway-a and gateway-b are identical FastAPI workers behind
# your edge load balancer / Render / Fly / k8s Service. Redis and Postgres
# are the shared backends for approvals + audit (images only — no new
# Python dependencies; drivers stay lazy/optional, see docs/SCALABILITY.md).
#
# Default profile runs everything on JSONL/in-memory (no drivers needed):
# the gateway image is unchanged (same Dockerfile). Flip a backend by
# uncommenting the matching environment lines after installing the optional
# driver in your image layer (`pip install "psycopg[binary]"` / redis).
#
# KNOBS (documented in docs/SCALABILITY.md):
#   AGENTSHIELD_DETECTORS=heuristic            detector set (llm adds latency)
#   AGENTSHIELD_RATE_LIMIT_PER_MIN=600         per-IP backpressure per replica
#   AGENTSHIELD_UPSTREAM_CMD / _ARGS           MCP stdio upstream to front
#   AGENTSHIELD_UPSTREAM_TIMEOUT_S=30          one upstream round-trip budget
#   AGENTSHIELD_AUDIT_BACKEND=jsonl|postgres|redis
#   AGENTSHIELD_APPROVAL_BACKEND=audit|memory|postgres|redis
#   AGENTSHIELD_POSTGRES_DSN                   e.g. below (compose DNS name)
#   AGENTSHIELD_REDIS_URL                      e.g. below (compose DNS name)
#   AGENTSHIELD_API_KEY / _ADMIN_KEY           gate the HTTP surface
#   AGENTSHIELD_HARNESS_SECRET                 provenance tokens (prod: set it)

services:
  gateway-a:
    build: .
    ports:
      - "8000:8000"
    environment:
      AGENTSHIELD_DETECTORS: heuristic
      AGENTSHIELD_RATE_LIMIT_PER_MIN: "600"
      AGENTSHIELD_AUDIT_BACKEND: jsonl
      AGENTSHIELD_APPROVAL_BACKEND: audit
      # Postgres audit + Redis approvals (needs optional drivers installed):
      # AGENTSHIELD_AUDIT_BACKEND: postgres
      # AGENTSHIELD_APPROVAL_BACKEND: redis
      # AGENTSHIELD_POSTGRES_DSN: postgresql://agentshield:agentshield@postgres:5432/agentshield
      # AGENTSHIELD_REDIS_URL: redis://redis:6379/0
      # AGENTSHIELD_API_KEY: ${AGENTSHIELD_API_KEY:-}
      # AGENTSHIELD_ADMIN_KEY: ${AGENTSHIELD_ADMIN_KEY:-}
      # AGENTSHIELD_HARNESS_SECRET: ${AGENTSHIELD_HARNESS_SECRET:-}
    depends_on:
      - redis
      - postgres

  gateway-b:
    build: .
    ports:
      - "8001:8000"
    environment:
      AGENTSHIELD_DETECTORS: heuristic
      AGENTSHIELD_RATE_LIMIT_PER_MIN: "600"
      AGENTSHIELD_AUDIT_BACKEND: jsonl
      AGENTSHIELD_APPROVAL_BACKEND: audit
      # AGENTSHIELD_AUDIT_BACKEND: postgres
      # AGENTSHIELD_APPROVAL_BACKEND: redis
      # AGENTSHIELD_POSTGRES_DSN: postgresql://agentshield:agentshield@postgres:5432/agentshield
      # AGENTSHIELD_REDIS_URL: redis://redis:6379/0
      # AGENTSHIELD_API_KEY: ${AGENTSHIELD_API_KEY:-}
      # AGENTSHIELD_ADMIN_KEY: ${AGENTSHIELD_ADMIN_KEY:-}
      # AGENTSHIELD_HARNESS_SECRET: ${AGENTSHIELD_HARNESS_SECRET:-}
    depends_on:
      - redis
      - postgres

  # Shared approval + cache backend (images only).
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - agentshield-redis:/data

  # Shared audit backend (images only).
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: agentshield
      POSTGRES_PASSWORD: agentshield
      POSTGRES_DB: agentshield
    volumes:
      - agentshield-postgres:/var/lib/postgresql/data

volumes:
  agentshield-redis:
  agentshield-postgres:
