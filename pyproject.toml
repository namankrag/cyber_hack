[project]
name = "agentshield"
version = "0.2.0"
description = "A policy enforcement layer that secures the AI agent at the tool boundary, not just the prompt."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.scripts]
secureai = "secureai.cli:main"

[tool.setuptools.packages.find]
where = [".", "patchproof"]
include = ["agentshield*", "secureai*", "patchproof*", "vulnbank*"]
namespaces = false

# Ship the bundled default policy inside the wheel so an installed package
# finds a policy without relying on the process working directory.
[tool.setuptools.package-data]
agentshield = ["data/*.yaml"]
patchproof = ["semgrep_rules/*.yaml"]
vulnbank = ["*.md"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
