[project]
name = "agentshield"
version = "0.2.0"
description = "A policy enforcement layer that secures the AI agent at the tool boundary, not just the prompt."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }

[project.scripts]
secureai = "secureai.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agentshield*", "secureai*", "patchproof*", "vulnbank*"]

# Ship the bundled default policy inside the wheel so an installed package
# finds a policy without relying on the process working directory.
[tool.setuptools.package-data]
agentshield = ["data/*.yaml", "data/*.jsonl"]
patchproof = ["semgrep_rules/*.yaml", "semgrep_rules/*.yml"]
vulnbank = ["*.md"]

[tool.pytest.ini_options]
pythonpath = [".", "patchproof"]
testpaths = ["tests", "patchproof/tests"]
