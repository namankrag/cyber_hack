[project]
name = "agentshield"
version = "0.1.0"
description = "A policy enforcement layer that secures the AI agent at the tool boundary, not just the prompt."
requires-python = ">=3.11"
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agentshield*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
